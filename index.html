<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SIM*BUCKS — Airport Coffee Kiosk Simulator</title>
<style>
  html,body{margin:0;height:100%;background:#0b0c0e;overflow:hidden;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff;
    /* A drag on a touch screen must move the camera, never select the UI. */
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;touch-action:none;
    overscroll-behavior:none}
  *,*::before,*::after{-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent}
  #app,#hud,canvas{touch-action:none}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;inset:0;pointer-events:none;user-select:none}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0b0c0e;z-index:50;flex-direction:column;gap:14px;letter-spacing:.18em;font-size:12px}
  #boot b{font-size:26px;letter-spacing:.34em;font-weight:800}
  #boot .bar{width:220px;height:2px;background:#26282d;overflow:hidden}
  #boot .bar i{display:block;height:100%;width:30%;background:#E2593C;animation:sl 1.1s infinite ease-in-out}
  @keyframes sl{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
  #err{position:fixed;left:0;right:0;bottom:0;max-height:34vh;overflow:auto;background:#2a0d0d;
    color:#ffb4a8;font:11px/1.5 ui-monospace,Menlo,monospace;padding:8px 12px;z-index:60;display:none;
    white-space:pre-wrap;pointer-events:auto}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud"></div>
<div id="boot"><b>SIM&#10033;BUCKS</b><div class="bar"><i></i></div><span>OPENING THE KIOSK</span></div>
<pre id="err"></pre>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
} }
</script>
<script type="module">
  window.addEventListener('error', e => window.__simbucksError?.(e.message));
  window.addEventListener('unhandledrejection', e => window.__simbucksError?.(String(e.reason)));
  import('./src/main.js').catch(e => {
    const el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent = 'FATAL: ' + (e && e.stack || e);
    document.getElementById('boot').style.display = 'none';
  });
</script>
</body>
</html>
